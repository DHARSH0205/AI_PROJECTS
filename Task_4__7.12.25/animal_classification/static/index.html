<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Classifier</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Card Container */
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: #fafafa;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .upload-icon {
            font-size: 40px;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: block;
        }

        .upload-text {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        /* Image Preview */
        #imagePreview {
            display: none;
            width: 100%;
            height: 250px;
            object-fit: contain; /* Shows full image without cropping */
            border-radius: 8px;
            margin-bottom: 1rem;
            background-color: #000; /* Black background for visibility */
        }

        /* Controls Section */
        .controls {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Styled Dropdown */
        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: white;
            color: var(--text-main);
            font-size: 1rem;
            appearance: none; /* Removes default arrow */
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Custom Arrow for Dropdown */
        .select-wrapper::after {
            content: '▼';
            font-size: 0.8rem;
            color: var(--text-sub);
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Button */
        .btn-classify {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-classify:hover {
            background-color: var(--primary-hover);
        }

        .btn-classify:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
        }

        /* Result Section */
        #resultContainer {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: none; /* Hidden by default */
        }

        .result-title {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .result-value {
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: bold;
        }

        .confidence {
            margin-top: 0.25rem;
            font-size: 0.9rem;
            color: var(--primary);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Wild Cat Classifier</h1>
        <p class="subtitle">Detect whether the image contains a Lion, Tiger, Cheetah, or Leopard</p>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*">
            <div id="uploadPlaceholder">
                <span class="upload-icon">📁</span>
                <p class="upload-text"><strong>Click to upload</strong> or drag and drop</p>
                <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;">SVG, PNG, JPG (max 2MB)</p>
            </div>
            <img id="imagePreview" alt="Preview">
        </div>

        <div class="controls">
            <div class="select-wrapper">
                <select id="modelSelect">
                    <option value="knn">K-Nearest Neighbors (KNN)</option>
                    <option value="logistic">Logistic Regression</option>
                    <option value="nb">Naive Bayes</option>
                </select>
            </div>

            <button class="btn-classify" id="classifyBtn" onclick="predict()">
                <span id="btnText">Classify Image</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </div>

        <div id="resultContainer">
            <p class="result-title">Prediction Result</p>
            <div class="result-value" id="predictionText">--</div>

        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const resultContainer = document.getElementById('resultContainer');
        const classifyBtn = document.getElementById('classifyBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
    
        // Handle File Selection
        fileInput.addEventListener('change', function(e) {
            handleFile(e.target.files[0]);
        });
    
        // Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
    
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
    
        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    uploadPlaceholder.style.display = 'none';
                    resultContainer.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }
    
        async function predict() {
            if (fileInput.files.length === 0) {
                alert("Please upload an image first!");
                return;
            }
    
            classifyBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            resultContainer.style.display = 'none';
    
            const model = document.getElementById('modelSelect').value;
            const file = fileInput.files[0];
    
            let formData = new FormData();
            formData.append("file", file);
            formData.append("selected_model", model);
    
            try {
                const res = await fetch("http://127.0.0.1:8000/predict", {
                    method: "POST",
                    body: formData
                });
    
                const data = await res.json();
    
                // Update result
                document.getElementById('predictionText').innerText = data.prediction;

                resultContainer.style.display = 'block';
    
            } catch (error) {
                alert("Backend API error! Is FastAPI running?");
                console.error(error);
            }
    
            classifyBtn.disabled = false;
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
        }
    </script>
</body>
</html>
